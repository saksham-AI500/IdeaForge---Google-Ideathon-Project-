steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ideaforge-web:$COMMIT_SHA'
      - '--build-arg'
      - 'VITE_FIREBASE_API_KEY=AIzaSyCXGqh_22NLJEpTsETBYztK5Wq65Ag7XgA'
      - '--build-arg'
      - 'VITE_FIREBASE_AUTH_DOMAIN=saksham-genai-academy-track-3.firebaseapp.com'
      - '--build-arg'
      - 'VITE_FIREBASE_PROJECT_ID=saksham-genai-academy-track-3'
      - '--build-arg'
      - 'VITE_FIREBASE_STORAGE_BUCKET=saksham-genai-academy-track-3.firebasestorage.app'
      - '--build-arg'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=121971590014'
      - '--build-arg'
      - 'VITE_FIREBASE_APP_ID=1:121971590014:web:35a8ef3df2b5c4ad6d292f'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ideaforge-web:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ideaforge-web'
      - '--image'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ideaforge-web:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NODE_ENV=production,FIREBASE_PROJECT_ID=saksham-genai-academy-track-3,FIREBASE_STORAGE_BUCKET=saksham-genai-academy-track-3.firebasestorage.app'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:1,TAVILY_API_KEY=TAVILY_API_KEY:1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ideaforge-web:$COMMIT_SHA'
